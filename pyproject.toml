[project]
name = "bot-orchestrator-hub"
version = "1.1.0"
description = "Centralized bot orchestrator for multi-platform messaging"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Andrea Bonini"}
]
keywords = ["telegram", "bot", "fastapi", "cloud-run", "orchestrator"]
dependencies = [
    "fastapi>=0.109.0,<0.120.0",
    "uvicorn[standard]>=0.27.0,<0.35.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "httpx>=0.26.0,<0.28.0",
    "structlog>=24.1.0,<25.0.0",
    "google-genai>=0.2.0",
    "google-cloud-vision>=3.4.0",
]

[project.urls]
Repository = "https://github.com/GabryXn/bot-orchestrator-hub"

# =============================================================================
# RUFF - Linting and Formatting (replaces black, isort, flake8)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "ASYNC",  # async best practices
    "B",      # bugbear
    "C4",     # comprehensions
    "DTZ",    # datetime timezone
    "T10",    # debugger
    "FA",     # future annotations
    "ISC",    # implicit string concat
    "PIE",    # misc lints
    "PT",     # pytest style
    "RET",    # return statements
    "SIM",    # simplify
    "TCH",    # type checking blocks
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "models", "router", "handlers", "telegram_client"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# MYPY - Static Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
pretty = true

[[tool.mypy.overrides]]
module = ["httpx.*", "structlog.*"]
ignore_missing_imports = true

# =============================================================================
# PYTEST - Testing Configuration
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring external services",
]

# =============================================================================
# COVERAGE - Test Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".agent/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "ruff>=0.2.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pre-commit>=3.6.0,<4.0.0",
]
