# Cloud Build configuration for automatic deployments
# Triggers on push to main branch

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bot-orchestrator:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bot-orchestrator:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/bot-orchestrator:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/bot-orchestrator:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bot-orchestrator'
      - '--image'
      - 'gcr.io/$PROJECT_ID/bot-orchestrator:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets'
      - 'TELEGRAM_TOKEN=TELEGRAM_TOKEN:latest,ORCHESTRATOR_SECRET=ORCHESTRATOR_SECRET:latest'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/bot-orchestrator:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/bot-orchestrator:latest'

# Timeout for the build
timeout: '600s'

# Substitutions (can be overridden)
substitutions:
  _REGION: 'europe-west1'
