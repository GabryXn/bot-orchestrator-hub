# Cloud Build configuration for automatic deployments
# Triggers on push to main branch

steps:
  # ==========================================================================
  # BUILD - Multi-stage Docker build
  # ==========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bot-orchestrator:$_IMAGE_TAG'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bot-orchestrator:latest'
      - '.'

  # ==========================================================================
  # PUSH - Container Registry
  # ==========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bot-orchestrator:$_IMAGE_TAG']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bot-orchestrator:latest']

  # ==========================================================================
  # DEPLOY - Cloud Run with optimizations
  # ==========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bot-orchestrator'
      - '--image=gcr.io/$PROJECT_ID/bot-orchestrator:$_IMAGE_TAG'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # Resource limits (free tier compliant)
      - '--cpu=1'
      - '--memory=512Mi'
      # Concurrency and scaling
      - '--concurrency=80'
      - '--min-instances=0'
      - '--max-instances=10'
      # Cold start optimization
      - '--cpu-boost'
      # Timeout
      - '--timeout=60s'
      # Secrets from Secret Manager
      - '--set-secrets=TELEGRAM_TOKEN=telegram-bot-token:latest,ORCHESTRATOR_SECRET=orchestrator-secret:latest'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/bot-orchestrator:$_IMAGE_TAG'
  - 'gcr.io/$PROJECT_ID/bot-orchestrator:latest'

# Build timeout
timeout: '600s'

# Substitutions (can be overridden)
substitutions:
  _REGION: 'europe-west8'
  _IMAGE_TAG: 'latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
